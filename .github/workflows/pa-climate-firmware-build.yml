name: PA Climate ESP32 firmware build

on:
  push:
    branches:
      - work/pa-climate-auto-msi-20261110
    paths:
      - "integrations/pa-climate-auto-v3/firmware/**"
      - "integrations/pa-climate-auto-v3/web/**"
      - "integrations/pa-climate-auto-v3/server/**"
      - ".github/workflows/pa-climate-firmware-build.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "integrations/pa-climate-auto-v3/firmware/**"
      - "integrations/pa-climate-auto-v3/web/**"
      - "integrations/pa-climate-auto-v3/server/**"
      - ".github/workflows/pa-climate-firmware-build.yml"

permissions:
  contents: read

jobs:
  esp32-wroom32e-n4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify dual-sensor UI mapping, server protocol and heating logic
        run: |
          set -euo pipefail
          node --test integrations/pa-climate-auto-v3/web/climateUiData.test.mjs integrations/pa-climate-auto-v3/server/tests/*.test.mjs
          g++ -std=c++17 -Iintegrations/pa-climate-auto-v3/firmware/FarmplastClimate integrations/pa-climate-auto-v3/tests/test_logic.cpp -o /tmp/pa_climate_logic_test
          /tmp/pa_climate_logic_test

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.3.1"

      - name: Install ESP32 board platform and libraries
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8
          arduino-cli lib install "OneWire" "DallasTemperature" "ArduinoJson"
          arduino-cli lib list

      - name: Compile ESP32-WROOM-32E-N4 dual DS18B20
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:FlashMode=dio,FlashFreq=40,PartitionScheme=default" \
            --warnings all \
            --output-dir build/pa-climate \
            integrations/pa-climate-auto-v3/firmware/FarmplastClimate
          find build/pa-climate -type f -maxdepth 1 -printf "%f %s bytes\n"

      - name: Compile standalone Arduino .ino exactly as supplied to owner
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:FlashMode=dio,FlashFreq=40,PartitionScheme=default" \
            --warnings all \
            --output-dir build/pa-climate-standalone \
            integrations/pa-climate-auto-v3/firmware/FarmplastClimateComplete
          python3 - <<'PY'
          from pathlib import Path
          candidates=list(Path('build/pa-climate-standalone').glob('*.ino.bin'))
          assert len(candidates)==1, f'Unexpected standalone build output: {candidates}'
          data=candidates[0].read_bytes()
          assert data[:1]==b'\\xE9', 'Invalid ESP32 application'
          assert len(data)<=0x140000, 'Standalone image exceeds OTA slot'
          assert b'PA_CLIMATE_FW_MODEL=PA-ESP32-WROOM32E-N4-R1' in data
          assert b'PA_CLIMATE_FW_VERSION=pa-climate-msi-2.0.0' in data
          print(f'Standalone .ino compiles and fits slot: {len(data)} bytes')
          PY

      - name: Validate application image size and identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('build/pa-climate').glob('*.ino.bin'))
          assert len(files)==1, f'Expected one Arduino application BIN, found: {files}'
          data=files[0].read_bytes()
          assert data[0] == 0xE9, 'Not an ESP32 application image'
          assert len(data) <= 0x140000, f'Application exceeds single OTA slot: {len(data)} bytes'
          for marker in [b'PA_CLIMATE_FW_VERSION=pa-climate-msi-2.0.0', b'PA_CLIMATE_FW_MODEL=PA-ESP32-WROOM32E-N4-R1']:
              assert marker in data, f'Firmware marker missing: {marker}'
          print(f'VALID ESP32 app: {files[0].name}, {len(data)} bytes, OTA slot 1,310,720')
          PY

      - name: Upload verified firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: Farmplast-PA-Climate-ESP32-WROOM32E-2_0_0
          path: build/pa-climate/
          retention-days: 14
