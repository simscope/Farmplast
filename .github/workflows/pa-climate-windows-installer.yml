name: PA Climate Windows installer checksums

on:
  push:
    branches:
      - work/pa-climate-auto-msi-20261110
    paths:
      - "integrations/pa-climate-auto-v3/automation/**"
      - ".github/workflows/pa-climate-windows-installer.yml"
  pull_request:
    branches: [main]
    paths:
      - "integrations/pa-climate-auto-v3/automation/**"
      - ".github/workflows/pa-climate-windows-installer.yml"

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell manual bootloader prompts and parse
        shell: powershell
        run: |
          $scripts=@(
            '.\\integrations\\pa-climate-auto-v3\\automation\\Auto-Add-ESP32.ps1',
            '.\\integrations\\pa-climate-auto-v3\\automation\\Install-Workstation.ps1'
          )
          foreach($script in $scripts){
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$null,[ref]$errors)
            if($errors.Count -gt 0){throw "PowerShell syntax error in $script : $($errors | Out-String)"}
          }
          $wizard=[IO.File]::ReadAllText($scripts[0])
          if(-not $wizard.Contains('ESP32 ROM DOWNLOAD MODE')){throw 'Missing IO0+EN first flash instruction'}
          if(-not $wizard.Contains('USB flash complete. Start the new firmware')){throw 'Missing EN reboot instruction before USB provisioning'}
      - name: Verify esptool 5.4.0 no-reset CLI arguments without ESP32
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check esptool==5.4.0
          if($LASTEXITCODE -ne 0){throw 'esptool v5.4.0 installation failed'}
          python -m esptool --chip esp32 --port COM4 --baud 115200 --before no-reset --after no-reset read-mac --help | Out-Null
          if($LASTEXITCODE -ne 0){throw 'esptool v5.4.0 CLI arguments rejected'}
      - name: Verify esptool v5 command handling and unmasked serial errors (no hardware)
        shell: powershell
        run: |
          node --test integrations/pa-climate-auto-v3/automation/onboard.test.mjs
      - name: Verify official SHA256 validation and archive extraction on Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\integrations\pa-climate-auto-v3\automation\tests\installer-checksums.test.ps1
